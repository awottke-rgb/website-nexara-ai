<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <!-- Gradients -->
  <defs>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>
  
  <!-- Outer Hexagon -->
  <polygon points="50,15 80,32 80,68 50,85 20,68 20,32" stroke="url(#icon-grad)" stroke-width="3.5" stroke-linejoin="round" />
  
  <!-- Inner structural 'N' -->
  <path d="M 36,36 L 36,64" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 36,36 L 64,64" stroke="url(#icon-grad)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 64,36 L 64,64" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
</svg>
