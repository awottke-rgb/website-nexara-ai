<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" width="340" height="100" fill="none">
  <!-- Gradients -->
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>
  
  <!-- Icon Mark (Ultra-clean, high-precision structural Hexagon 'N') -->
  <g id="logo-mark">
    <!-- Outer Hexagon -->
    <polygon points="45,18 72,34 72,66 45,82 18,66 18,34" stroke="url(#logo-grad)" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Inner structural 'N' -->
    <path d="M 32,36 L 32,64" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 32,36 L 58,64" stroke="url(#logo-grad)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 58,36 L 58,64" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  </g>
  
  <!-- Typography -->
  <!-- "Nexara" - matching the site's Syne bold display font -->
  <text x="96" y="65" font-family="'Syne', var(--font-display), sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.02em">
    Nexara
  </text>
  
  <!-- "AI" - matching the clean modern Geist sans-serif -->
  <text x="262" y="65" font-family="'Geist', var(--font-sans), sans-serif" font-size="36" font-weight="700" fill="url(#logo-grad)" letter-spacing="0.04em">
    AI
  </text>
  
  <!-- Minimalist technical accent under AI -->
  <rect x="264" y="73" width="34" height="2.5" rx="1.25" fill="url(#logo-grad)" />
</svg>
